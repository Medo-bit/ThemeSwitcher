name: Publish to WinGet

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release-tag:
        description: 'اكتب اسم التاج هنا (اتركه فارغاً لأحدث إصدار)'
        required: false
        default: 'v4.1.2'
        type: string

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Get latest release tag if not provided
        id: get_tag
        if: inputs.release-tag == ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $latest = gh api repos/${{ github.repository }}/releases/latest --jq .tag_name
          echo "tag=$latest" >> $env:GITHUB_OUTPUT

      - name: Submit to WinGet
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: Medoo.ThemeSwitcher
          installers-regex: '\.exe$'
          release-tag: ${{ inputs.release-tag || steps.get_tag.outputs.tag }}
          token: ${{ secrets.WINGET_TOKEN }}
