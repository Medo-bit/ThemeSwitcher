name: Publish to WinGet

on:
  release:
    types: [published]
  # 👇 هذا هو الـ Trigger الخارجي الذي يشتغل فور وصول إشعار انتهاء Azure CDN
  repository_dispatch:
    types: [winget-cdn-published]
  workflow_dispatch:
    inputs:
      test-tag:
        description: 'Tag to update badge manually'
        required: true
        default: 'v4.2.1'
        type: string

jobs:
  # الوظيفة الأولى: تشتغل فقط عند نشر Release جديد (تخلص في 15 ثانية وتقفل)
  publish:
    if: github.event_name == 'release'
    runs-on: windows-latest
    env:
      PACKAGE_ID: Medoo.ThemeSwitcher
      INSTALLER_NAME: ThemeSwitcher_Setup.exe
      ARCH: x64
    steps:
      - name: Verify release asset exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          $assets = gh release view $tag --repo "${{ github.repository }}" --json assets --jq ".assets[].name"
          if ($assets -notcontains $env:INSTALLER_NAME) {
            throw "Installer asset '$env:INSTALLER_NAME' not found in release $tag!"
          }

      - name: Install Komac
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall

      - name: Install Komac binary
        shell: pwsh
        run: cargo-binstall komac --no-confirm

      - name: Submit to WinGet
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          $version = $tag.TrimStart("v")
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/$env:INSTALLER_NAME|$env:ARCH"
          komac sync-fork
          komac update $env:PACKAGE_ID --version $version --urls "$url" --submit

  # الوظيفة الثانية: تشتغل كـ Trigger فقط عندما يكتمل النشر على Azure CDN! (سريعة جداً على سيرفر Linux)
  update-badge:
    if: github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      GIST_ID: 054b1958bd619172448d0e730de0cb47 # 👈 ضع رقم الـ Gist هنا
    steps:
      - name: Get Latest Release Tag
        id: get_tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.test-tag }}"
          } else {
            $tag = gh release view --repo "${{ github.repository }}" --json tagName --jq ".tagName"
          }
          Write-Host "Target Tag for Badge: $tag"
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Update WinGet Badge via Gist
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.WINGET_TOKEN }}
          gistID: ${{ env.GIST_ID }}
          filename: winget-cdn.json
          label: WinGet
          message: ${{ steps.get_tag.outputs.tag }}
          color: 00A4EF
          cacheSeconds: 300

      - name: Wait for Shields.io Sync & Purge GitHub Camo Cache
        shell: pwsh
        run: |
          $tag = "${{ steps.get_tag.outputs.tag }}"
          $gistRawUrl = "https://gist.githubusercontent.com/${{ github.repository_owner }}/$env:GIST_ID/raw/winget-cdn.json"
          $shieldsUrl = "https://img.shields.io/endpoint?url=$gistRawUrl"

          for ($i = 1; $i -le 20; $i++) {
            try {
              $svg = (Invoke-WebRequest -Uri $shieldsUrl -UseBasicParsing).Content
              if ($svg -match [regex]::Escape($tag)) { break }
            } catch {}
            Start-Sleep -Seconds 15
          }

          $repoPage = Invoke-WebRequest -Uri "https://github.com/${{ github.repository }}" -UseBasicParsing
          $camoUrls = [regex]::Matches($repoPage.Content, 'https://camo\.githubusercontent\.com/[a-f0-9]+/[a-f0-9]+') | ForEach-Object { $_.Value } | Select-Object -Unique
          foreach ($url in $camoUrls) {
            try { Invoke-WebRequest -Uri $url -Method "PURGE" -UseBasicParsing | Out-Null } catch {}
          }
